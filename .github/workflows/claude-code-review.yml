name: Claude Code Review

on:
  pull_request:
    # synchronize deliberately absent: the review would otherwise re-run, and
    # re-bill, on every push into an open PR. One review per PR is the trade.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Dependabot PRs — the bot cannot access repository secrets
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: posting inline comments goes through POST /pulls/{n}/reviews,
      # and a PR-level summary through the issues endpoint. Needed to say anything at
      # all — though note the execution log later showed the earlier silence was NOT a
      # permissions problem (zero denials); see the claude_args comment below.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # v1.0.174
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          allowed_bots: 'claude[bot]'
          # The review used to delegate its first step to a background subagent and then
          # end its turn waiting for the result. In a one-shot CI run nothing can deliver
          # that result — the run ends with the turn — so it exited "success" after 6
          # turns having never looked at the diff (execution log for #312: Agent started,
          # then ScheduleWakeup, sleep 1, a blocked sleep 30, and "I'll just wait for the
          # automatic notification"). A bare tool name in --disallowedTools removes the
          # tool from the model's context entirely, so the same work happens inline
          # instead of being handed off. Task is the older name for Agent; ScheduleWakeup
          # is the stalling mechanism it reached for next.
          claude_args: |
            --disallowedTools "Agent,Task,ScheduleWakeup"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action writes a turn-by-turn log — including which tool calls were denied and
      # why — to a file that is otherwise thrown away with the runner. Without it a review
      # that *could not* post is indistinguishable from one that had nothing to say, which
      # is what made the permissions problem above invisible for two PRs.
      - name: Collect execution log
        if: always()
        run: |
          src="${{ steps.claude-review.outputs.execution_file }}"
          # Fall back to the path the action logs when the output is not set.
          [ -n "$src" ] && [ -f "$src" ] || src="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$src" ]; then
            cp "$src" "${RUNNER_TEMP}/claude-review-log.json"
          else
            echo "No execution log found (looked at: $src)"
          fi

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-review-log
          path: ${{ runner.temp }}/claude-review-log.json
          if-no-files-found: warn
