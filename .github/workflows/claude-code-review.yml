name: Claude Code Review

on:
  pull_request:
    # synchronize has to stay while claude-review is a required status check: GitHub
    # evaluates required checks against the head commit, so a job that does not run on
    # a pushed commit never reports there and the PR is blocked forever. Dropping it to
    # save the per-run cost did exactly that to #312. Remove it only together with
    # claude-review's required-check entry in the ruleset.
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Dependabot PRs — the bot cannot access repository secrets
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # read is enough, and matches the documented example: the review posts through
      # the Claude GitHub App, which carries its own write access, not through this
      # job's GITHUB_TOKEN. These were briefly widened to write on the theory that
      # missing permissions were why the review never commented; the execution logs
      # disproved that (zero denials), and #317 confirmed it by posting three inline
      # comments once the claude_args allowlist below was in place.
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # v1.0.174
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is what makes the review visible. Without it the plugin writes its
          # findings only into its own execution log, which is discarded with the runner:
          # the #313 run reviewed the diff properly across 27 turns and still posted
          # nothing, closing with "No --comment flag was passed, so no GitHub comments
          # were posted." Every run before that had the same gap on top of the subagent
          # stall, so no PR in this repo has ever been shown a finding.
          # The skill's step 1 skips a PR that Claude has already commented on, which
          # makes the review one-shot: push a fix and it declines to look again. That
          # is the wrong default here, since `synchronize` is in the trigger precisely
          # so a fix gets re-checked. The extra instructions lift that one condition
          # and keep the rest, and tell it to read the existing threads first so a
          # re-review does not re-post findings that are already open — which matters
          # doubly because unresolved threads block merging in the ruleset.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            This workflow runs on every push to an open pull request, and re-reviewing
            after a fix is the intent. In step 1, do not treat "Claude has already
            commented on this PR" as a reason to skip. Every other skip condition still
            applies: closed, draft, and changes too trivial to need review.

            You may have reviewed an earlier commit of this PR. Read the existing review
            comments before you post anything, and do not repeat a finding that an open
            thread already covers. Comment only on what is new in the latest commits, or
            on a previously reported issue whose attempted fix does not actually resolve
            it — and in that case say what is still wrong with it.
          allowed_bots: 'claude[bot]'
          # The review used to delegate its first step to a background subagent and then
          # end its turn waiting for the result. In a one-shot CI run nothing can deliver
          # that result — the run ends with the turn — so it exited "success" after 6
          # turns having never looked at the diff (execution log for #312: Agent started,
          # then ScheduleWakeup, sleep 1, a blocked sleep 30, and "I'll just wait for the
          # automatic notification"). A bare tool name in --disallowedTools removes the
          # tool from the model's context entirely, so the same work happens inline
          # instead of being handed off. Task is the older name for Agent; ScheduleWakeup
          # is the stalling mechanism it reached for next.
          # --allowedTools is not a formality here: the action starts the MCP server that
          # posts inline comments ONLY when claude_args names its tool, so without this
          # line the tool is absent from the session and the review has nothing to post
          # with. The #315 run found three real bugs, could not reach that tool, fell back
          # to `gh api`, and was blocked there as a mutating call — so it reported nothing.
          # The skill's own allowed-tools frontmatter naming the tool is not enough; the
          # docs are explicit that this line must be kept anyway.
          claude_args: |
            --disallowedTools "Agent,Task,ScheduleWakeup"
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action writes a turn-by-turn log — including which tool calls were denied and
      # why — to a file that is otherwise thrown away with the runner. Without it a review
      # that *could not* post is indistinguishable from one that had nothing to say, which
      # is what made the permissions problem above invisible for two PRs.
      - name: Collect execution log
        if: always()
        run: |
          src="${{ steps.claude-review.outputs.execution_file }}"
          # Fall back to the path the action logs when the output is not set.
          [ -n "$src" ] && [ -f "$src" ] || src="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$src" ]; then
            cp "$src" "${RUNNER_TEMP}/claude-review-log.json"
          else
            echo "No execution log found (looked at: $src)"
          fi

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-review-log
          path: ${{ runner.temp }}/claude-review-log.json
          if-no-files-found: warn
