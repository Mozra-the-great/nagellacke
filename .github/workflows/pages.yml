name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # Release notes live under docs/ but nothing on the site links to them,
      # so a notes-only commit should not trigger a deploy. They still ship
      # with the next deploy that a real docs change causes.
      - '!docs/releases/**'
      # Same for the setup guides (#213): they are Markdown read on GitHub,
      # not part of the static site, so editing one is not a site change.
      - '!docs/*.md'
      # Archived documents (#380) are history, not part of the site.
      - '!docs/archive/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Turn Pages on for the repo if it is not enabled yet, instead of
          # failing with "Get Pages site failed ... Not Found".
          enablement: true

      - name: Upload docs folder
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
