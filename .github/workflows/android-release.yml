# FROZEN since #372 (Android EOL, tag `android-final`). Kept, not deleted: the
# secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD stay in
# the repository. The `android-v*` tag trigger is switched off so a stray tag
# cannot start a release; the workflow can still be run by hand via "Run
# workflow". To resume releases, restore the tag trigger below - see
# docs/android-wieder-aufnehmen.md.
name: Android Release Build

on:
  # push:
  #   tags:
  #     - 'android-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to the proprietary gradle-actions-caching component (Gradle Terms of Use);
          # "basic" is the MIT-licensed cache built on @actions/cache (setup-gradle >= 6.1).
          cache-provider: basic

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nagellacke-release.jks
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/nagellacke-release.jks" >> $GITHUB_ENV

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
