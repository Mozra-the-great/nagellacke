name: CI

on:
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - 'android/**'
      # the shared merge fixtures are read by tests on both sides, so a
      # fixtures-only change still has to run them
      - 'fixtures/**'
      # a change to the pipeline itself has to run the pipeline — without this
      # a commit that only edits this file matches no path, so a broken job
      # definition would land on main unverified
      - '.github/workflows/ci.yml'
      # the label script's tests run in `build` below, and they also check
      # that every tracked path is matched by a rule in labels.json
      - 'scripts/ci/**'
      - '.github/labels.json'
  # Deliberately unfiltered, unlike the push trigger above: `build` and
  # `build-android` (the latter skipped via ANDROID_ENABLED since #372) are
  # required status checks on main, and a required check that
  # never runs is reported as pending forever rather than skipped — a docs-only PR
  # would match no path, never report, and stay unmergeable. Paying a couple of
  # runner-minutes on such a PR is the cheaper side of that trade.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install
        # ci, not install: `npm install` is free to resolve versions the lockfile
        # does not name, so CI could build against a dependency tree no
        # contributor has. `npm ci` installs the lockfile exactly and fails if the
        # two disagree, which makes a green build mean something.
        #
        # This was previously blocked by package-lock.json carrying only
        # Windows-platform entries for the native optional deps, hence the
        # workflow_dispatch step that deleted the lockfile to force a fresh
        # resolution. That is fixed: the lockfile now names every platform binary
        # (@rollup/rollup-linux-x64-gnu, @rolldown/binding-linux-x64-gnu and
        # @esbuild/linux-x64 among them), so the workaround and the artifact that
        # existed to ship a repaired lockfile out of CI are both gone.
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Build sync
        run: npm run build:sync

      - name: Build server
        run: npm run build:server

      - name: Build web
        run: npm run build:web

      - name: Test
        # Not core only, despite the old label: the root script is
        # `--workspaces --if-present`, so this covers core, server and web.
        run: npm run test

      - name: Test label script
        # scripts/ci/labels.py (see labels.yml) gates nothing, but a rule that
        # never matches leaves PRs unlabelled with a green run. Standard library
        # only, so the runner's python3 is enough. Runs from the repo root; the
        # job default is v3/.
        working-directory: .
        run: python3 -m unittest discover -s scripts/ci -p "test_*.py"

  build-android:
    # FROZEN since #372 (Android EOL, tag `android-final`): the job is kept, not
    # deleted, and only runs when the repository variable ANDROID_ENABLED is
    # 'true' (Settings -> Secrets and variables -> Actions -> Variables).
    # `build-android` is still a required status check on main; a job skipped
    # through a job-level `if` reports as skipped, which GitHub counts as passing,
    # so PRs stay mergeable without running Gradle. (A *workflow-level* skip, e.g.
    # a path filter, would leave the check pending forever - do not move this
    # condition up to the workflow.) To resume Android work see
    # docs/android-wieder-aufnehmen.md.
    if: ${{ vars.ANDROID_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to the proprietary gradle-actions-caching component (Gradle Terms of Use);
          # "basic" is the MIT-licensed cache built on @actions/cache (setup-gradle >= 6.1).
          cache-provider: basic

      - name: Unit tests
        # Runs before the APK build on purpose: assembleDebug only proves the
        # Kotlin compiles, and #297 was a logic bug that compiled cleanly.
        # These are JVM unit tests (app/src/test/), no emulator needed.
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        # Gradle prints only the failing test names; the HTML/XML report has
        # the assertion diffs and stack traces needed to fix them.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        # Debug build only - no signing secrets needed (uses AGP's built-in
        # debug signing config) and the OAuth client id BuildConfig fields
        # (app/build.gradle.kts) fall back to empty strings when the
        # corresponding secrets/local.properties entries are absent.
        run: ./gradlew assembleDebug
