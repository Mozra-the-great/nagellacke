version: 2

# Keeps the SHA-pinned actions in .github/workflows fresh: every `uses:` line is
# pinned to a commit with a version comment, and Dependabot rewrites both.
#
# npm covers the v3 workspace (packages/*, apps/*, server): one lockfile at
# v3/package-lock.json, so a single `/v3` entry reaches every workspace. Routine
# minor/patch bumps arrive as one grouped PR a week; major bumps stay separate
# PRs so a breaking change is reviewed on its own. Security updates keep working
# independently of this schedule (alerts open their own PRs, as with #408).
#
# The frozen Android app (#372) is deliberately left out (no gradle entry), see
# docs/android-wieder-aufnehmen.md. Add an ecosystem here when that changes.
#
# cooldown (zizmor audit dependabot-cooldown): a new release is proposed only after
# 7 days, so a compromised release is usually noticed before it reaches a PR.
# Dependabot's security updates ignore the cooldown.
#
# The runtime is Node 20 (v3/Dockerfile node:20-alpine, ci.yml, install.sh), so three
# npm entries are held back until it moves to Node 22:
#  - @types/node majors: the typings must match the Node the code runs on; 21+
#    would type APIs Node 20 does not have.
#  - @fastify/static >= 10.1.4: it pulls in content-disposition 3, which is
#    ESM-only (engines node >=22) and loads through require(esm), i.e. only on
#    Node >= 20.19, while install.sh and engines accept any Node 20. v3/server pins
#    10.1.3 exactly.
#  - tsup majors: tsup 9 declares node ^22.18 and its CLI require()s ESM-only
#    dependencies (cac 7, chokidar 5); it runs on Node >= 20.19 but fails with
#    ERR_REQUIRE_ESM on older 20.x (verified on 20.10), and the build runs on the
#    host during install.sh and the self-update pipeline.
# Drop these ignores together with the Node 22 move.
#
# Dependabot cannot read repository secrets, so claude-review skips its PRs
# (`github.actor != 'dependabot[bot]'`); a skipped required check counts as passing.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: "npm"
    directory: "/v3"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/static"
        versions: [">=10.1.4"]
      - dependency-name: "tsup"
        update-types: ["version-update:semver-major"]
